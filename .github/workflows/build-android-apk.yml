name: Build PartyQueue Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'source/**'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PartyQueue
        uses: actions/checkout@v4

      - name: Restore original Android source (verified)
        shell: bash
        run: |
          set -euo pipefail
          cat source/partyqueue.tar.xz.b64.part* | tr -d '\r\n' | base64 --decode > /tmp/partyqueue-source.tar.xz
          echo "5cd74a6c22f84d8c2803805c8924e759168c666d48b3424cae149db19ac73b0f  /tmp/partyqueue-source.tar.xz" | sha256sum --check
          tar -xJf /tmp/partyqueue-source.tar.xz -C .
          test -f app/build.gradle
          test -f settings.gradle

      - name: Check code safeguards
        run: python3 tests/check_package.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PartyQueue-v0.26.11.03.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
